name: platform-backend-tests

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai-train
            path: apps/ai-train/backend
            extra_pip: ""
          - name: ai-test
            path: apps/ai-test/backend
            extra_pip: "onnxruntime==1.24.4"
          - name: ai-license-mgr
            path: apps/ai-license-mgr/backend
            extra_pip: "cryptography==46.0.6"
          - name: ai-builder
            path: apps/ai-builder/backend
            extra_pip: ""
          - name: ai-prod
            path: apps/ai-prod/backend
            extra_pip: "cryptography==46.0.6"
          - name: ai-sdk
            path: apps/ai-sdk/backend
            extra_pip: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装基础依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.116.1 uvicorn==0.35.0 sqlalchemy==2.0.41 ${EXTRA_PIP}
        env:
          EXTRA_PIP: ${{ matrix.extra_pip }}
      - name: 执行 ${{ matrix.name }} 后端测试
        run: |
          cd "${MODULE_PATH}"
          PYTHONPATH=. python -m unittest discover -s tests -v
        env:
          MODULE_PATH: ${{ matrix.path }}

  shared-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验共享 schema 与示例
        run: |
          python -m unittest discover -s apps/shared/tests -v
