[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-capability-platform-ai-prod-backend"
version = "0.1.0"
description = "ai-prod 后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==46.0.6",
  "fastapi==0.116.1",
  "sqlalchemy==2.0.41",
  "uvicorn==0.35.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
